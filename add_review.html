<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review - Al-Mabit Al-Najdi</title>

    <link rel="icon" href="images/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a href="index.html" class="logo-container">
            <img src="images/logo.png" alt="HBNB logo" class="logo">
        </a>

        <nav>
            <a href="index.html">Places</a>
            <a
                href="login.html"
                id="login-link"
                class="login-button"
            >
                Login
            </a>
        </nav>
    </header>

    <main>
        <section class="login-container">
            <h1>Add a Review</h1>

            <p>Share your experience at Al-Mabit Al-Najdi.</p>

            <form
                id="review-form"
                class="form-container"
                action="#"
                method="post"
            >
                <div class="form-group">
                    <label for="review">Your Review</label>

                    <textarea
                        id="review"
                        name="review"
                        placeholder="Write your review here"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="rating">Rating</label>

                    <select id="rating" name="rating" required>
                        <option value="">Select rating</option>
                        <option value="5">★★★★★</option>
                        <option value="4">★★★★☆</option>
                        <option value="3">★★★☆☆</option>
                        <option value="2">★★☆☆☆</option>
                        <option value="1">★☆☆☆☆</option>
                    </select>
                </div>

                <p id="review-message" aria-live="polite"></p>

                <button type="submit" class="submit-button">
                    Submit Review
                </button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Al-Mabit Al-Najdi. All rights reserved.</p>
        <p class="designer-credit">Made by Razan</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
