<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details - Al-Mabit Al-Najdi</title>

    <link rel="icon" href="images/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a href="index.html">
            <img
                src="images/logo.png"
                alt="Al-Mabit Al-Najdi logo"
                class="logo"
            >
        </a>

        <nav>
            <a href="index.html">Places</a>

            <a
                href="login.html"
                id="login-link"
                class="login-button"
            >
                Login
            </a>
        </nav>
    </header>

    <main>
        <h1 id="place-page-title"></h1>

        <section id="place-details" class="place-details">
            <!-- Place information is loaded from the API -->
        </section>

        <section class="reviews-section">
            <h2>Reviews</h2>

            <div id="reviews-list">
                <!-- Reviews are loaded from the API -->
            </div>
        </section>

        <section
            id="add-review"
            class="add-review"
            style="display: none;"
        >
            <h2>Share Your Experience</h2>

            <p>Stayed here before? Leave a review.</p>

            <a
                id="add-review-link"
                href="#"
                class="details-button"
            >
                Add a Review
            </a>
        </section>
    </main>

    <footer>
        <p>Made with care by Razan — Al-Mabit Al-Najdi.</p>
        <p>&copy; 2026 Al-Mabit Al-Najdi. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
