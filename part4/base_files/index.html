<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Mabit Al-Najdi - Places</title>

    <link rel="icon" href="images/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a href="index.html" class="logo-container">
            <img
                src="images/logo.png"
                alt="Al-Mabit Al-Najdi logo"
                class="logo"
            >
        </a>

        <nav>
            <a href="index.html">Places</a>
            <a href="login.html" id="login-link" class="login-button">
                Login
            </a>
        </nav>
    </header>

    <main>
        <h1>Al-Mabit Al-Najdi</h1>

        <p class="page-intro">
            Discover traditional Najdi stays inspired by the heritage of Riyadh.
        </p>

        <section class="filters">
            <label for="price-filter">Max Price:</label>

            <select id="price-filter">
                <option value="all">All</option>
                <option value="10">10</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </section>

        <section id="places-list" class="places">
            <!-- Places are loaded dynamically from the API -->
        </section>
    </main>

    <footer>
        <p>© 2026 Al-Mabit Al-Najdi. All rights reserved.</p>
        <p class="designer-credit">Made by Razan</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
