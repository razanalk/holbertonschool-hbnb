<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Al-Mabit Al-Najdi</title>
    <link rel="icon" href="images/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <a href="index.html" class="logo-container">
        <img src="images/logo.png" alt="HBNB logo" class="logo">
    </a>

    <nav>
        <a href="index.html">Places</a>
        <a href="login.html" class="login-button">Login</a>
    </nav>
</header>

<main>

    <section class="login-container">

        <h1>Welcome Back</h1>

        <p>
            Sign in to continue exploring Al-Mabit Al-Najdi.
        </p>

	<form id="login-form" class="form-container" action="#" method="post">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="submit-button">
                Login
            </button>

        </form>

    </section>

</main>

<footer>
    <p>&copy; 2026 Al-Mabit Al-Najdi. All rights reserved.</p>
    <p class="designer-credit">Made by Razan</p>
</footer>

    <script src="scripts.js"></script>
</body>
</html>
